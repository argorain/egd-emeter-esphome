esphome:
  name: ${name}
  friendly_name: ${friendly_name}
  name_add_mac_suffix: false

esp32:
  board: esp32-s3-devkitc-1
  variant: esp32s3
  flash_size: 16MB
  framework:
    type: esp-idf

psram:
  mode: octal

# Custom component that decodes the DLMS/COSEM push telegrams from the meter.
# Pulled from this same repo, so the device only needs the top-level YAML.
external_components:
  - source: github://argorain/egd-emeter-esphome@master
    components: [dlms_push_meter]
    refresh: 0s

# --- Base network / diagnostics ---------------------------------------------

wifi:
  ssid: "${wifi_ssid}"
  password: "${wifi_password}"
  ap:
    ssid: "${friendly_name} Fallback"

captive_portal:

api:
  encryption:
    key: "${api_encryption_key}"

ota:
  - platform: esphome
    password: "${ota_password}"

logger:
  # The board's only UART is wired to the meter's RS485 lines (GPIO17/18),
  # so hardware UART logging is disabled; logs go out over the native USB
  # port and over the network (API/OTA) instead.
  baud_rate: 0

web_server:
  port: 80

# --- RS485 link to the meter --------------------------------------------

# The meter push interface is one-way (meter -> customer only), so the ESP32
# never transmits on the bus. The RS485 transceiver's DE (driver-enable) pin
# is GPIO21 on this board and MUST be held low at all times, otherwise the
# transceiver may drive the bus and collide with the meter's own telegrams.
output:
  - platform: gpio
    pin:
      number: GPIO21
      inverted: false
    id: rs485_de_pin
    # Output components default to the "off" state during setup(), which is
    # exactly the receive-only state we want (DE low). Nothing ever turns it on.

uart:
  id: meter_uart
  tx_pin: GPIO17
  rx_pin: GPIO18
  baud_rate: 9600
  data_bits: 8
  parity: NONE
  stop_bits: 1
  rx_buffer_size: 1024

dlms_push_meter:
  id: meter
  uart_id: meter_uart

# --- Entities exposed to Home Assistant -------------------------------------

sensor:
  - platform: dlms_push_meter
    dlms_push_meter_id: meter
    power_import:
      name: "Power Import"
    power_import_l1:
      name: "Power Import L1"
    power_import_l2:
      name: "Power Import L2"
    power_import_l3:
      name: "Power Import L3"
    power_export:
      name: "Power Export"
    power_export_l1:
      name: "Power Export L1"
    power_export_l2:
      name: "Power Export L2"
    power_export_l3:
      name: "Power Export L3"
    energy_import:
      name: "Energy Import Total"
    energy_import_rate1:
      name: "Energy Import Rate 1"
    energy_import_rate2:
      name: "Energy Import Rate 2"
    energy_import_rate3:
      name: "Energy Import Rate 3"
    energy_import_rate4:
      name: "Energy Import Rate 4"
    energy_export:
      name: "Energy Export Total"
    power_limit:
      name: "Power Limiter"
    unknown_obis_count:
      name: "Unknown OBIS Fields"

  - platform: wifi_signal
    name: "WiFi Signal"
    entity_category: diagnostic
    update_interval: 60s

  - platform: uptime
    name: "Uptime"
    entity_category: diagnostic

text_sensor:
  - platform: dlms_push_meter
    dlms_push_meter_id: meter
    serial_number:
      name: "Meter Serial Number"
    device_name:
      name: "Meter Device Name"
    active_tariff:
      name: "Active Tariff"
    consumer_message:
      name: "Consumer Message"
    push_setup_reference:
      name: "Push Setup Reference"
    unknown_obis_list:
      name: "Unknown OBIS Codes"

  - platform: version
    name: "ESPHome Version"
    entity_category: diagnostic

binary_sensor:
  - platform: dlms_push_meter
    dlms_push_meter_id: meter
    disconnect_status:
      name: "Main Supply Connected"
    relay1:
      name: "Relay 1 Connected"
    relay2:
      name: "Relay 2 Connected"
    relay3:
      name: "Relay 3 Connected"
    relay4:
      name: "Relay 4 Connected"
    relay5:
      name: "Relay 5 Connected"
    relay6:
      name: "Relay 6 Connected"
